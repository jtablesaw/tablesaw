name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Test the Java LTS versions and latest version available
        java-version: [11, 23]
        os: [macOS-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          # Smile's MKL dependencies only provide x64 binaries for macOS.
          architecture: x64
      - name: Test with Maven
        run: mvn --batch-mode --show-version test
